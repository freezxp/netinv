{{- /*
   A Service for any component that listens for traffic rather than only
   serving its ops endpoint. Flow is the first: exporters push to it, so unlike
   every other service it needs to be reachable from the network the devices
   are on — usually a LoadBalancer or a nodePort, which is a decision for the
   deployment rather than the chart.
*/ -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.listen }}
apiVersion: v1
kind: Service
metadata:
  name: netinv-{{ $name }}
  labels:
    {{- include "netinv.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: {{ $svc.serviceType | default "ClusterIP" }}
  selector: { app.kubernetes.io/name: netinv, app.kubernetes.io/component: {{ $name }} }
  ports:
    {{- range $svc.listen }}
    - { name: {{ .name }}, port: {{ .port }}, targetPort: {{ .port }}, protocol: {{ .protocol | default "TCP" }} }
    {{- end }}
---
{{- end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: netinv-api
  labels:
    {{- include "netinv.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector: { app.kubernetes.io/name: netinv, app.kubernetes.io/component: api }
  ports:
    - { name: http, port: 80, targetPort: {{ .Values.services.api.port }} }
---
apiVersion: v1
kind: Service
metadata:
  name: netinv-frontend
  labels:
    {{- include "netinv.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector: { app.kubernetes.io/name: netinv, app.kubernetes.io/component: frontend }
  ports:
    - { name: http, port: 80, targetPort: {{ .Values.frontend.port }} }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netinv
  labels: {{- include "netinv.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # /api first: the frontend image deliberately does not proxy the API
          # (its nginx.conf serves static assets only), because in a cluster
          # this split is the ingress's job. Without this rule the SPA loads and
          # every request it makes returns the SPA again — a UI that renders
          # perfectly and cannot fetch anything.
          - path: /api
            pathType: Prefix
            backend: { service: { name: netinv-api, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: netinv-frontend, port: { name: http } } }
{{- end }}
