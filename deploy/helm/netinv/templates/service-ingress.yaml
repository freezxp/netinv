apiVersion: v1
kind: Service
metadata:
  name: netinv-api
  labels: { app.kubernetes.io/name: netinv, app.kubernetes.io/component: api }
spec:
  selector: { app.kubernetes.io/name: netinv, app.kubernetes.io/component: api }
  ports:
    - { name: http, port: 80, targetPort: {{ .Values.services.api.port }} }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netinv
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: netinv-api, port: { name: http } } }
{{- end }}
