{{- include "netinv.validate" . -}}
{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netinv-{{ $name }}
  labels:
    {{- include "netinv.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $svc.replicas }}
  {{- if hasKey $svc "maxUnavailable" }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: {{ $svc.maxUnavailable }}, maxSurge: 1 }
  {{- end }}
  selector:
    matchLabels: { app.kubernetes.io/name: netinv, app.kubernetes.io/component: {{ $name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: netinv, app.kubernetes.io/component: {{ $name }} }
    spec:
      {{- if $.Values.priorityClasses.create }}
      {{- /* Collection survives node pressure ahead of the UI; notify goes first (doc 19 §6). */}}
      priorityClassName: {{ if has $name (list "scheduler" "poller" "ingester" "flow") }}netinv-collection{{ else if eq $name "notifier" }}netinv-notify{{ else }}netinv-app{{ end }}
      {{- end }}
      # In-flight work drains on SIGTERM: finish what is running, requeue the
      # rest (doc 19 §2). Shorter than the grace period a consumer needs and
      # messages are redelivered rather than lost, but the churn is pointless.
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        {{- if eq $name "poller" }}
        # The poller writes its identity and overflow buffer to the state dir.
        fsGroup: 65532
        {{- end }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}-{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports:
            - { containerPort: {{ $svc.port }}, name: ops }
            {{- range $svc.listen }}
            - { containerPort: {{ .port }}, name: {{ .name }}, protocol: {{ .protocol | default "TCP" }} }
            {{- end }}
          env:
            - { name: NETINV_LOG_LEVEL, value: {{ $.Values.logLevel | quote }} }
            - { name: NETINV_HTTP_ADDR, value: ":{{ $svc.port }}" }
            {{- if has "pg" $svc.needs }}
            {{- if $.Values.data.postgres.enabled }}
            - name: NETINV_PG_DSN
              valueFrom:
                secretKeyRef: { name: {{ include "netinv.pgSecretName" $ }}, key: NETINV_PG_DSN }
            {{- else }}
            - { name: NETINV_PG_DSN, value: {{ include "netinv.pgDSN" $ | quote }} }
            {{- end }}
            {{- end }}
            {{- if has "redis" $svc.needs }}
            - { name: NETINV_REDIS_ADDR, value: {{ include "netinv.redisAddr" $ | quote }} }
            {{- end }}
            {{- if has "amqp" $svc.needs }}
            {{- if $.Values.data.rabbitmq.enabled }}
            - name: NETINV_AMQP_URL
              valueFrom:
                secretKeyRef: { name: {{ include "netinv.pgSecretName" $ }}, key: NETINV_AMQP_URL }
            {{- else }}
            - { name: NETINV_AMQP_URL, value: {{ include "netinv.amqpURL" $ | quote }} }
            {{- end }}
            {{- end }}
            {{- if has "vm" $svc.needs }}
            - { name: NETINV_VM_URL, value: {{ include "netinv.vmURL" $ | quote }} }
            {{- end }}
            {{- if eq $name "api" }}
            # The API rejects range queries past this rather than clamping them,
            # so a ceiling below the store's actual retention hides history you
            # are still paying to keep.
            - { name: NETINV_VM_RETENTION, value: {{ $.Values.retention | quote }} }
            - { name: NETINV_INSECURE_COOKIES, value: {{ ternary "1" "0" $.Values.insecureCookies | quote }} }
            {{- end }}
            {{- if and (include "netinv.uiURL" $) (has $name (list "api" "alerter")) }}
            - { name: NETINV_UI_URL, value: {{ include "netinv.uiURL" $ | quote }} }
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          envFrom:
            - secretRef: { name: {{ $.Values.secrets.existingSecret }} }
          volumeMounts:
            # The root filesystem is read-only, so anything that writes needs an
            # explicit mount. /tmp covers scratch files across all services.
            - { name: tmp, mountPath: /tmp }
            {{- if eq $name "poller" }}
            - { name: state, mountPath: {{ $svc.env.NETINV_STATE_DIR | quote }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: ops }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: ops }
            initialDelaySeconds: 10
          resources: {{- toYaml $.Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $name "poller" }}
        - name: state
          # Overflow buffer and identity only. The core-site poller sits beside
          # its broker, so the buffer is rarely used and its loss on reschedule
          # costs one re-enrolment rather than data — a remote-site poller is a
          # different case and the netinv-poller chart gives it a PVC.
          emptyDir: {}
        {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netinv-frontend
  labels:
    {{- include "netinv.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: netinv, app.kubernetes.io/component: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: netinv, app.kubernetes.io/component: frontend }
    spec:
      {{- if .Values.priorityClasses.create }}
      priorityClassName: netinv-app
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx in the alpine image
        # Required, not decorative. emptyDir arrives root-owned without it, and
        # nginx exits immediately with
        #   [emerg] mkdir() "/var/cache/nginx/client_temp" failed (13)
        # — verified by running the image under exactly this context.
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}-frontend:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # nginx listens on 80. Most container runtimes set
              # net.ipv4.ip_unprivileged_port_start=0, which makes this
              # unnecessary — binding :80 as uid 101 with no capabilities at all
              # was verified working. Kept because that sysctl is a runtime
              # default rather than a guarantee, and the failure it prevents is
              # a pod that never becomes ready on one cluster and is fine on
              # another.
              add: [NET_BIND_SERVICE]
          ports: [{ containerPort: 80, name: http }]
          # nginx writes its pid and its caches; with a read-only root it needs
          # these, and fails to start rather than degrading if they are absent.
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
