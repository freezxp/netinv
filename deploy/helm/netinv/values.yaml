# NetInv core-site chart (doc 19). Every option documented per NFR-54.
#
# Out of the box this installs a complete, working NetInv: the seven app
# services, the frontend, and a single-replica data tier. That default is aimed
# at a lab or an evaluation (NFR-50). For production, turn the data tier off and
# point the connection values at stores you manage — see values-prod.example.yaml.

image:
  repository: ghcr.io/freezxp/netinv # images are <repository>-<service>
  tag: latest # pin a digest in production
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Data tier
#
# Each store is independently toggleable, so "bring your own Postgres, use the
# chart's Redis" is a supported shape. When a store is enabled the chart also
# derives the connection string for it, and `connections` below is ignored for
# that store — set the connection only for stores you have disabled.
#
# What the chart installs is deliberately simple: one replica, one PVC, no
# operator. It is not an HA data tier and does not pretend to be. Production
# wants CloudNativePG for Postgres, the RabbitMQ cluster operator, and a
# VictoriaMetrics sized per doc 04 — all of which live outside this chart
# because they are cluster-level decisions with their own lifecycles.
# ---------------------------------------------------------------------------
data:
  postgres:
    enabled: true
    image: postgres:16-alpine
    database: netinv
    username: netinv
    # Leave empty and the chart generates one on first install and reuses it on
    # every upgrade (it reads back its own Secret). Set it explicitly if you
    # prefer to know it, or if your GitOps tooling renders manifests without
    # cluster access — with no cluster to read, an empty password would be
    # regenerated on each render and the application would stop being able to
    # log in to a database whose password had not actually changed.
    password: ""
    storage: { size: 20Gi, storageClass: "" }
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: "2", memory: 1Gi }
  victoriametrics:
    enabled: true
    image: victoriametrics/victoria-metrics:v1.103.0
    # Must equal `retention` below, which is what the API enforces. They are
    # one setting split across two components: if the API's ceiling is lower
    # than the store's, range queries 422 for history you are still paying to
    # keep; if it is higher, they return empty for history that was deleted.
    storage: { size: 50Gi, storageClass: "" }
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "2", memory: 2Gi }
  redis:
    enabled: true
    image: redis:7-alpine
    # Redis holds leader leases and caches, never the only copy of anything, so
    # it is intentionally not persisted. Losing it costs a leader election.
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
  rabbitmq:
    enabled: true
    image: rabbitmq:3.13-management-alpine
    username: netinv
    password: "" # generated and preserved, as with postgres above
    storage: { size: 8Gi, storageClass: "" }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }

# Connection endpoints for stores you manage yourself. Each is used only when
# the corresponding `data.<store>.enabled` is false.
connections:
  pgDSN: "" # postgres://user:pass@host:5432/netinv
  redisAddr: "" # host:6379
  amqpURL: "" # amqp://user:pass@host:5672/
  vmURL: "" # http://host:8428

# How long metrics are kept. Read by VictoriaMetrics *and* by the API, which
# rejects range queries beyond it rather than clamping them.
retention: 2y

# ---------------------------------------------------------------------------
# Secrets (doc 19 §4)
#
# NETINV_MASTER_KEY and NETINV_JWT_SIGNING_KEY are never generated by this
# chart. The master key encrypts every stored device credential, and a key that
# only exists inside a Helm release is one `helm uninstall` away from taking the
# credential vault with it — and it is deliberately absent from backups
# (doc 20 §12.3), so a restore cannot bring it back either. Create it yourself,
# keep a copy somewhere durable, and name the Secret here:
#
#   kubectl create secret generic netinv-keys \
#     --from-literal=NETINV_MASTER_KEY="$(openssl rand -base64 32)" \
#     --from-literal=NETINV_JWT_SIGNING_KEY="$(openssl rand -base64 32)" \
#     --from-literal=NETINV_ADMIN_PASSWORD="<initial admin password>"
# ---------------------------------------------------------------------------
secrets:
  existingSecret: netinv-keys

ingress:
  enabled: true
  className: nginx
  host: netinv.example.internal
  # Without a certificate the login form posts a password in cleartext. The
  # single-host deployment generates a self-signed pair rather than ship
  # without one (doc 20 §12.1); in a cluster this is cert-manager's job.
  tlsSecret: ""
  annotations: {}

frontend:
  replicas: 2
  port: 80
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# External URL used in alert deep links. Defaults to the ingress host when
# empty — an alert email whose link goes nowhere is worse than no link.
uiURL: ""

# Session cookies carry Secure unless this is set. Only set it for a
# deliberately plain-HTTP install: with Secure cookies over HTTP the browser
# accepts the login response and never sends the cookie back, which presents as
# a broken login rather than as a configuration choice.
insecureCookies: false

# ---------------------------------------------------------------------------
# Per-service topology (doc 05 §2). The poller here is the core-site poller;
# remote sites use the netinv-poller chart.
# ---------------------------------------------------------------------------
services:
  api:
    replicas: 2
    port: 8080
    needs: [pg, redis, amqp, vm]
    # No api pod may be unavailable during a rollout: it is the only thing the
    # UI and the pollers talk to (doc 19 §2).
    maxUnavailable: 0
  scheduler:
    replicas: 2 # leader-elected
    port: 8081
    needs: [pg, redis, amqp]
  poller:
    replicas: 1
    port: 8082
    needs: [amqp]
    env:
      NETINV_SITE_ID: s_default
      NETINV_STATE_DIR: /var/lib/netinv-poller
  ingester:
    replicas: 2
    port: 8083
    needs: [pg, amqp, vm]
  alerter:
    replicas: 2 # leader-elected
    port: 8084
    needs: [pg, redis, amqp, vm]
  notifier:
    replicas: 1
    port: 8085
    needs: [pg, amqp]
  flow:
    # Single replica on purpose. Flow arrives over UDP with no delivery
    # guarantee and no way to replay, and NetFlow v9/IPFIX state is per
    # exporter: a second replica would see half of one exporter's datagrams and
    # none of its templates, and decode nothing. Scaling means partitioning
    # exporters across collectors, which needs its own design.
    replicas: 1
    port: 8086
    needs: [vm]
    # Exporters push to this one, so unlike every other service it has to be
    # reachable from the device network. How devices reach the cluster is a
    # property of the network, not of the chart — set LoadBalancer or NodePort.
    serviceType: ClusterIP
    # Listening ports, as opposed to the ops port above. Both conventional
    # numbers are bound because the exporter usually picks; see doc 34 §2.
    listen:
      - { name: netflow, port: 2055, protocol: UDP }
      - { name: ipfix, port: 4739, protocol: UDP }
    env:
      # Buckets kept per interface per dimension per interval. The default
      # suits a small-to-medium fleet; a large one must lower it, because the
      # cost is N x 3 x 2 series per interface (doc 34 §1, NFR-03).
      NETINV_FLOW_TOPN: "25"
      # Anything that can reach 2055/udp can otherwise write series (ADR-020).
      # Comma-separated exporter addresses; empty accepts from anywhere the
      # NetworkPolicy allows.
      NETINV_FLOW_ALLOW: ""

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }

# Horizontal autoscaling for the two services whose load tracks usage rather
# than fleet size (doc 19 §6). Ingester scaling is queue-depth driven and needs
# KEDA, which is why it is not here.
autoscaling:
  api:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# Under node pressure, collection survives first — it is the product. Data tier
# outranks the collection path, which outranks the UI, which outranks notify
# (doc 19 §6). These are cluster-scoped objects with global names, so a cluster
# that already defines them wants create=false.
priorityClasses:
  create: true

# Default-deny ingress and egress within the namespace (doc 19 §5). Off by
# default because it silently breaks collection on a cluster whose CNI does not
# enforce NetworkPolicy at all — it looks applied and does nothing.
networkPolicy:
  enabled: false
  # CIDRs the poller may reach for SNMP/ICMP, and the flow collector may be
  # reached from. Empty means the policy would block all device traffic, so
  # enabling the policy without setting these stops collection.
  deviceCIDRs: []

# Prometheus Operator ServiceMonitor for the services' own /metrics endpoints.
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

logLevel: info

# Drain window for in-flight work on SIGTERM (doc 19 §2).
terminationGracePeriodSeconds: 60
