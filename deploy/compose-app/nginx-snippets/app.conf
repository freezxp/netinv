# The server body shared by every frontend mode: the SPA, the /api proxy and
# the security headers.
#
# It lives in a snippet rather than in each template because the modes differ
# in exactly one thing — what port 80 does — and everything else must stay
# identical. Duplicating this block is how a header quietly ends up set on
# HTTPS and missing on the HTTP origin.
root /usr/share/nginx/html;
index index.html;

# HSTS without preload and without includeSubDomains: this commonly runs on
# an internal name that also serves other things, and poisoning a whole
# domain's browsers from a monitoring box is a bad trade. Turn both on once
# the deployment owns its name.
#
# It is emitted in http mode too. A browser ignores HSTS received over plain
# HTTP (RFC 6797 §8.1), so it does nothing on a direct hit to port 8090; when
# a TLS-terminating proxy sits in front, the browser's connection *is* HTTPS
# and the header is both honoured and wanted.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# frame-ancestors in the CSP is the modern control; X-Frame-Options is kept
# for browsers that predate it.
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# The app is a self-contained SPA: no CDN, no third-party fonts, no
# analytics, and its only network destination is its own /api. The policy
# says exactly that, so anything injected has nowhere to send what it takes.
#
# style-src needs 'unsafe-inline' because the charting and flow-graph
# libraries set element styles directly; script-src does not, which is the
# half that matters for XSS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Passed for logging and for anything downstream that cares about the
    # original scheme. It does *not* drive the Secure flag on session
    # cookies: the api sets that from NETINV_INSECURE_COOKIES alone and
    # never reads this header, which is why serving the origin over plain
    # HTTP behind a TLS-terminating proxy still yields Secure cookies.
    proxy_set_header X-Forwarded-Proto $scheme;
    # A full SNMP walk is the one endpoint that legitimately takes minutes:
    # tens of thousands of objects, at a 5s per-request SNMP timeout. nginx
    # defaults to a 60s read timeout, which cut those exports off as a 504
    # partway through the tree — indistinguishable, from the browser, from a
    # device that stopped answering.
    proxy_read_timeout 300s;
}
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    # add_header inside a location replaces the inherited set rather than
    # adding to it, so the security headers have to be repeated here or
    # every asset response silently loses them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}
