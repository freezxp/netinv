# Full containerized NetInv deployment (all images, one host). This is the
# self-contained deploy target: every service runs as its built image against
# the compose data tier. For on-prem Kubernetes use the Helm charts (doc 31).
#
#   cd deploy/compose-app
#   cp .env.example .env    # then edit secrets
#   docker compose --env-file .env -f ../../docker-compose.yml \
#                  -f docker-compose.deploy.yml up -d --build
#
# The base docker-compose.yml (repo root) provides postgres/redis/rabbitmq/
# victoriametrics/snmpsim/mailhog; this overlay wires the six app services +
# frontend with real connection strings and secrets.
services:
  api:
    restart: unless-stopped
    profiles: [app]
    environment:
      NETINV_LOG_LEVEL: info
      NETINV_PG_DSN: postgres://netinv:${PG_PASSWORD}@postgres:5432/netinv
      NETINV_REDIS_ADDR: redis:6379
      NETINV_AMQP_URL: amqp://netinv:${RABBIT_PASSWORD}@rabbitmq:5672/
      NETINV_VM_URL: http://victoriametrics:8428
      # Must match victoriametrics' -retentionPeriod, or the API rejects range
      # queries for history the store is still holding.
      NETINV_VM_RETENTION: ${NETINV_VM_RETENTION:-2y}
      NETINV_MASTER_KEY: ${NETINV_MASTER_KEY}
      NETINV_JWT_SIGNING_KEY: ${NETINV_JWT_SIGNING_KEY}
      NETINV_ADMIN_PASSWORD: ${NETINV_ADMIN_PASSWORD}
      NETINV_UI_URL: ${NETINV_UI_URL:-http://localhost:8090}
      # TLS terminates at the frontend, so session cookies are Secure by
      # default now. Set to 1 only for a plain-HTTP deployment, where Secure
      # cookies would never be sent back and login would appear to succeed and
      # then immediately fail.
      NETINV_INSECURE_COOKIES: ${NETINV_INSECURE_COOKIES:-0}

  scheduler:
    restart: unless-stopped
    profiles: [app]
    environment:
      NETINV_PG_DSN: postgres://netinv:${PG_PASSWORD}@postgres:5432/netinv
      NETINV_REDIS_ADDR: redis:6379
      NETINV_AMQP_URL: amqp://netinv:${RABBIT_PASSWORD}@rabbitmq:5672/
      NETINV_MASTER_KEY: ${NETINV_MASTER_KEY}
    depends_on: { api: { condition: service_started } }

  poller:
    restart: unless-stopped
    profiles: [app]
    # The poller runs as a non-root user (uid 65532) and uses unprivileged
    # ICMP — SOCK_DGRAM, not raw sockets — which the kernel gates on
    # net.ipv4.ping_group_range. Docker normally sets that to "0 2147483647"
    # per container and it just works.
    #
    # Inside an unprivileged Proxmox LXC it does not: the value 2147483647 is
    # not mappable in the container's user namespace, so Docker's write is
    # clamped to "65534 65534" — a range of exactly one gid, and not the
    # poller's. ICMP then fails while SNMP keeps working, so every device
    # reports down over ping while its graphs keep filling. Setting the range
    # explicitly to a value that *is* mappable fixes it, and is harmless on a
    # normal Docker host where uids are well below 65534 anyway.
    #
    # Measured on Proxmox VE 9.2 / Debian 13 / Docker 26.1 (doc 33 §4.2).
    sysctls:
      net.ipv4.ping_group_range: "0 65534"
    environment:
      NETINV_AMQP_URL: amqp://netinv:${RABBIT_PASSWORD}@rabbitmq:5672/
      # "*" serves whatever the scheduler announces. The alternative — a
      # comma-separated list maintained by hand — is the single most reliable
      # way to lose collection silently on a single-host deployment: create a
      # site, move a device into it, and its jobs queue up unread until
      # somebody remembers to edit this and restart the poller. Nothing fails,
      # because nothing runs. Set CORE_SITE_ID to an explicit list only when a
      # poller must be restricted to part of the estate.
      NETINV_SITE_ID: ${CORE_SITE_ID:-*}
      NETINV_STATE_DIR: /var/lib/netinv-poller
    # The image runs non-root; a named volume is root-owned. In k8s the poller
    # pod sets fsGroup so the PVC is group-writable (see netinv-poller chart);
    # on a single host, tmpfs gives the non-root user a writable state dir.
    # The buffer is ephemeral overflow only, and with the broker local it is
    # rarely used — acceptable to not persist it here.
    #
    # mode is explicit because Docker applies the tmpfs default (1777) when a
    # container is *created* but not when an existing one is *started*: after a
    # reboot the mount came back root-owned and the poller died on every start
    # with "mkdir /var/lib/netinv-poller/buffer: permission denied". Collection
    # stopped fleet-wide and nothing else in the stack reported a problem.
    tmpfs: ["/var/lib/netinv-poller:mode=1777"]

  # The only service that accepts unsolicited input from the network. Its port
  # is published deliberately — an exporter has to reach it — and
  # NETINV_FLOW_ALLOW should list the exporters once they are known, because
  # anything that can reach 2055/udp can otherwise write series (ADR-020).
  flow:
    restart: unless-stopped
    profiles: [app]
    ports: ["2055:2055/udp", "4739:4739/udp"]
    environment:
      NETINV_VM_URL: http://victoriametrics:8428
      NETINV_FLOW_ADDR: ":2055,:4739"
      # Buckets kept per interface per dimension per interval. Unset uses the
      # built-in default; raise it for more depth on a small fleet, lower it on
      # a large one — the cost is series (doc 34 §1).
      NETINV_FLOW_TOPN: "${NETINV_FLOW_TOPN:-}"
      NETINV_FLOW_ALLOW: ${NETINV_FLOW_ALLOW:-}
      # Flow writes its own series rather than going through the ingester, so
      # it mirrors too — otherwise a backup holds everything except the
      # traffic composition.
      NETINV_VM_MIRROR_URL: ${NETINV_VM_MIRROR_URL:-}

  ingester:
    restart: unless-stopped
    profiles: [app]
    environment:
      NETINV_AMQP_URL: amqp://netinv:${RABBIT_PASSWORD}@rabbitmq:5672/
      NETINV_PG_DSN: postgres://netinv:${PG_PASSWORD}@postgres:5432/netinv
      NETINV_VM_URL: http://victoriametrics:8428
      # Comma-separated backup VictoriaMetrics instances. Every batch is
      # copied to each, best-effort: a mirror that is down or slow never
      # delays or fails production ingest. The copy is therefore complete only
      # for the time the mirror was reachable — nothing backfills a gap, and
      # netinv_vm_mirror_failed_total counts them. For a guaranteed copy put
      # vmagent in front, which has a persistent queue and replays.
      NETINV_VM_MIRROR_URL: ${NETINV_VM_MIRROR_URL:-}

  alerter:
    restart: unless-stopped
    profiles: [app]
    environment:
      NETINV_PG_DSN: postgres://netinv:${PG_PASSWORD}@postgres:5432/netinv
      NETINV_REDIS_ADDR: redis:6379
      NETINV_AMQP_URL: amqp://netinv:${RABBIT_PASSWORD}@rabbitmq:5672/
      NETINV_VM_URL: http://victoriametrics:8428
      NETINV_UI_URL: ${NETINV_UI_URL:-http://localhost:8090}

  notifier:
    restart: unless-stopped
    profiles: [app]
    environment:
      NETINV_PG_DSN: postgres://netinv:${PG_PASSWORD}@postgres:5432/netinv
      NETINV_AMQP_URL: amqp://netinv:${RABBIT_PASSWORD}@rabbitmq:5672/
      NETINV_MASTER_KEY: ${NETINV_MASTER_KEY}

  frontend:
    restart: unless-stopped
    profiles: [app]
    # Context is resolved against the compose project directory (repo root).
    # NETINV_VERSION stamps the footer; unset it and the build falls back to
    # package.json, so an unstamped deployment still names a version rather
    # than showing a blank.
    build:
      context: frontend
      args:
        NETINV_VERSION: ${NETINV_VERSION:-}
    # 8090 serves plain HTTP and does nothing but redirect to 8443. TLS is the
    # way in; the HTTP listener exists so a bookmark or a typed hostname still
    # arrives somewhere rather than failing to connect.
    ports: ["8090:80", "8443:443"]
    depends_on: { api: { condition: service_started } }
    volumes:
      # Route /api to the api service (the ingress does this in k8s), terminate
      # TLS, and set the security headers. Swap for frontend-proxy.conf to run
      # without TLS — see doc 20 §12 for why that is a bad idea on anything
      # reachable by more than one person.
      - ./deploy/compose-app/frontend-tls.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/compose-app/certs:/etc/nginx/certs:ro
    environment:
      # The published HTTPS port, as a suffix for the HTTP->HTTPS redirect.
      # Empty when serving on the standard 443.
      TLS_PORT_SUFFIX: "${NETINV_TLS_PORT_SUFFIX-:8443}"

