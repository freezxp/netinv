# Single-host deployment: nginx serves the SPA and proxies /api to the api
# service (in k8s the ingress does this split — doc 19).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A full SNMP walk is the one endpoint that legitimately takes minutes:
        # tens of thousands of objects, at a 5s per-request SNMP timeout. nginx
        # defaults to a 60s read timeout, which cut those exports off as a 504
        # partway through the tree — indistinguishable, from the browser, from a
        # device that stopped answering.
        proxy_read_timeout 300s;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
