# Image publishing (doc 25 §2 build.yml): every main push + tag builds
# multi-arch images to GHCR. The on-prem cluster pulls; GitHub holds no
# cluster credentials (pull model, doc 25 §3).
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

# Serialize image pushes: concurrent runs (e.g. a branch push and its tag)
# race on identical layer blobs in GHCR.
concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  backend-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, scheduler, poller, ingester, alerter, notifier]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/netinv-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      # NOTE: the poller image name matches the netinv-poller chart; the core
      # chart consumes ghcr.io/<owner>/netinv-<service>.
      - uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}"
          file: backend/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  frontend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/netinv-frontend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:frontend"
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
