# CI per doc 25 — path-filtered jobs: backend (build/vet/test + connector
# contract), frontend (typecheck/build), security (gitleaks/licences/vuln
# scans), and a Playwright E2E smoke against a real data tier. Doc 25 §5.1
# lists what is deliberately not wired yet, and why.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'connectors/**'
            frontend:
              - 'frontend/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netinv
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: netinv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netinv" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The Dockerfile's base image must ship a toolchain at least as new as
      # go.work asks for. The alpine images set GOTOOLCHAIN=local, so they
      # cannot download a newer one, and the image build dies with
      #   go: ../go.work requires go >= X (running Y; GOTOOLCHAIN=local)
      # while `go build` on a runner with setup-go succeeds. That split kept CI
      # green against a Dockerfile that could not build on any machine whose
      # base-image cache predated the Go release.
      - name: Dockerfile Go pin covers go.work
        run: |
          set -euo pipefail
          want=$(grep -oP '^go \K[0-9.]+' go.work)
          have=$(grep -oP '^FROM golang:\K[0-9.]+' backend/Dockerfile)
          echo "go.work wants $want; backend/Dockerfile pins $have"
          if [ "$(printf '%s\n%s\n' "$want" "$have" | sort -V | head -1)" != "$want" ]; then
            echo "::error::backend/Dockerfile pins golang:$have but go.work requires >= $want"
            exit 1
          fi
          case "$have" in
            *.*.*) ;;
            *) echo "::error::pin the exact patch (golang:X.Y.Z-alpine); a floating tag makes the build depend on when the base image was last pulled"; exit 1;;
          esac
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      # Built from source with this repo's Go toolchain rather than pulled as a
      # prebuilt binary. The released v1.62.2 binary is built with Go 1.23 and
      # refuses a module targeting 1.26 ("the Go language version used to build
      # golangci-lint is lower than the targeted Go version"), which is also
      # why `go run` is what works on a developer's machine. Same command in
      # both places means a clean local run means a clean CI run.
      - name: golangci-lint (backend)
        working-directory: backend
        run: go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.2 run --timeout 5m -c ../.golangci.yml ./...
      - name: golangci-lint (connectors)
        working-directory: connectors
        run: go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.2 run --timeout 5m -c ../.golangci.yml ./...
      - name: Test (unit + PG integration)
        working-directory: backend
        env:
          NETINV_TEST_PG_DSN: postgres://netinv:ci@localhost:5432/netinv
        run: go test -race ./...
      - name: Connector tests
        working-directory: connectors
        run: go test ./...
      - name: Connector plugin contract (doc 10 §6)
        run: make connector-lint
      - name: Coverage ratchet
        working-directory: backend
        env:
          NETINV_TEST_PG_DSN: postgres://netinv:ci@localhost:5432/netinv
        run: ../scripts/coverage.sh

  helm:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.3 }
      - name: helm lint
        run: helm lint deploy/helm/netinv deploy/helm/netinv-poller
      # lint alone accepts a chart whose templates cannot produce valid
      # manifests; rendering is what catches a broken range or a missing value.
      #
      # Rendering the *defaults* only is not enough either. Two template bugs
      # that welded a `---` separator onto the next line lived exclusively in
      # the networkPolicy and autoscaling paths, so a default-only render was
      # green against a chart that could not install with the production
      # overlay. Every toggle gets rendered and validated.
      - name: helm template + kubeconform across the value matrix
        run: |
          set -euo pipefail
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /tmp kubeconform
          validate() { # name, then helm args
            name="$1"; shift
            helm template ci "$@" > "/tmp/render-$name.yaml"
            /tmp/kubeconform -strict -summary -ignore-missing-schemas "/tmp/render-$name.yaml" \
              | sed "s/^/  $name: /"
          }
          cidrs='networkPolicy.deviceCIDRs={10.0.0.0/8}'
          validate poller     deploy/helm/netinv-poller
          validate default    deploy/helm/netinv
          validate prod       deploy/helm/netinv -f deploy/helm/netinv/values-prod.example.yaml
          validate everything deploy/helm/netinv \
            --set autoscaling.api.enabled=true --set serviceMonitor.enabled=true \
            --set networkPolicy.enabled=true --set "$cidrs"
          validate minimal    deploy/helm/netinv \
            --set priorityClasses.create=false --set ingress.enabled=false
          validate external   deploy/helm/netinv \
            --set data.postgres.enabled=false --set data.redis.enabled=false \
            --set data.rabbitmq.enabled=false --set data.victoriametrics.enabled=false \
            --set connections.pgDSN=postgres://u:p@h:5432/n --set connections.redisAddr=h:6379 \
            --set connections.amqpURL=amqp://u:p@h:5672/ --set connections.vmURL=http://h:8428
      # The chart refuses to render configurations that install cleanly and then
      # fail: no master key, a disabled store with no connection string, a
      # NetworkPolicy that would deny the poller every device. Assert the
      # refusals, or they rot into no-ops without anything going red.
      - name: guard rails refuse bad values
        run: |
          set -euo pipefail
          refuses() {
            desc="$1"; shift
            if helm template ci deploy/helm/netinv "$@" > /dev/null 2>&1; then
              echo "FAIL: chart rendered despite $desc"; exit 1
            fi
            echo "  refused: $desc"
          }
          refuses "no master-key secret"        --set secrets.existingSecret=""
          refuses "postgres off, no pgDSN"      --set data.postgres.enabled=false
          refuses "rabbitmq off, no amqpURL"    --set data.rabbitmq.enabled=false
          refuses "redis off, no redisAddr"     --set data.redis.enabled=false
          refuses "vm off, no vmURL"            --set data.victoriametrics.enabled=false
          refuses "netpol on, no deviceCIDRs"   --set networkPolicy.enabled=true
      # A generated password is used twice — once as the store's own credential
      # and once inside the DSN handed to the app. `randAlphaNum` is
      # re-evaluated per invocation, so without memoisation those are two
      # different strings and every service fails auth against a database that
      # initialised with the other one. It renders perfectly either way, which
      # is why it survived to a cluster; assert the values match.
      - name: generated passwords are internally consistent
        run: |
          helm template ci deploy/helm/netinv > /tmp/pw.yaml
          python3 - <<'PY'
          import re, sys, yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/pw.yaml')) if d]
          sec = [d for d in docs if d['kind'] == 'Secret'][0]['stringData']
          bad = False
          for pw_key, url_key in (('PG_PASSWORD', 'NETINV_PG_DSN'),
                                  ('AMQP_PASSWORD', 'NETINV_AMQP_URL')):
              in_url = re.search(r'://[^:]+:([^@]+)@', sec[url_key]).group(1)
              if sec[pw_key] != in_url:
                  print(f"FAIL: {pw_key} does not match the password inside {url_key}")
                  bad = True
          print("ok: store credentials match the connection strings" if not bad else "")
          sys.exit(1 if bad else 0)
          PY

  security:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (CLI — no org license needed)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect -s /repo --no-git --redact -c /repo/.gitleaks.toml
      - name: Dependency licences
        run: make licenses
      # The repository is public and its shell scripts are the first thing a
      # contributor runs. Two real deliberate word-splits are annotated with a
      # reason rather than silenced wholesale.
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable \
            $(git ls-files '*.sh' | sed 's|^|/mnt/|')
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: npm audit (high+)
        working-directory: frontend
        run: npm audit --audit-level=high

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck & build
        working-directory: frontend
        run: npm run build

  e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: netinv, POSTGRES_PASSWORD: ci, POSTGRES_DB: netinv }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netinv" --health-interval 5s
          --health-timeout 3s --health-retries 10
      # The suite has outgrown "api + Postgres is enough for a smoke test". It
      # now covers weathermaps, whose cards fetch live utilization, and alert
      # rules, whose validation asks VictoriaMetrics to parse the expression —
      # a test asserting the UI shows "rejected this expression" needs
      # something present to do the rejecting.
      victoriametrics:
        image: victoriametrics/victoria-metrics:v1.103.0
        ports: ["8428:8428"]
        options: >-
          --health-cmd "wget -q -O- http://127.0.0.1:8428/health || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build & start api
        working-directory: backend
        env:
          NETINV_PG_DSN: postgres://netinv:ci@localhost:5432/netinv
          NETINV_VM_URL: http://localhost:8428
          NETINV_REDIS_ADDR: localhost:6379
          NETINV_ADMIN_PASSWORD: e2e-admin-password
          NETINV_INSECURE_COOKIES: "1"
        run: |
          # Ephemeral vault key generated at runtime — no key literal in the repo.
          export NETINV_MASTER_KEY="$(openssl rand -base64 32)"
          go build -o /tmp/netinv-api ./cmd/api
          /tmp/netinv-api & echo $! > /tmp/api.pid
          for i in $(seq 1 30); do curl -sf localhost:8080/readyz && break; sleep 1; done
      - name: Frontend deps + Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E smoke
        working-directory: frontend
        env: { NETINV_ADMIN_PASSWORD: e2e-admin-password }
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-trace, path: frontend/test-results/ }
