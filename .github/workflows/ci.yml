# CI per doc 25 §2 — Sprint-1 scope: build/vet/test backend, typecheck/build
# frontend, path-filtered. Integration/E2E/security jobs land with their sprints.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'connectors/**'
            frontend:
              - 'frontend/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netinv
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: netinv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netinv" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test (unit + PG integration)
        working-directory: backend
        env:
          NETINV_TEST_PG_DSN: postgres://netinv:ci@localhost:5432/netinv
        run: go test -race ./...
      - name: Connector tests
        working-directory: connectors
        run: go test ./...

  security:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (CLI — no org license needed)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect -s /repo --no-git --redact
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: npm audit (high+)
        working-directory: frontend
        run: npm audit --audit-level=high

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck & build
        working-directory: frontend
        run: npm run build

  e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: netinv, POSTGRES_PASSWORD: ci, POSTGRES_DB: netinv }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netinv" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build & start api (skeleton auth path is enough for smoke)
        working-directory: backend
        env:
          NETINV_PG_DSN: postgres://netinv:ci@localhost:5432/netinv
          NETINV_ADMIN_PASSWORD: e2e-admin-password
          NETINV_INSECURE_COOKIES: "1"
        run: |
          # Ephemeral vault key generated at runtime — no key literal in the repo.
          export NETINV_MASTER_KEY="$(openssl rand -base64 32)"
          go build -o /tmp/netinv-api ./cmd/api
          /tmp/netinv-api & echo $! > /tmp/api.pid
          for i in $(seq 1 30); do curl -sf localhost:8080/readyz && break; sleep 1; done
      - name: Frontend deps + Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E smoke
        working-directory: frontend
        env: { NETINV_ADMIN_PASSWORD: e2e-admin-password }
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-trace, path: frontend/test-results/ }
