# SPA serving; /api is routed by the ingress to netinv-api (doc 19), so this
# server only handles static assets + history-API fallback.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
